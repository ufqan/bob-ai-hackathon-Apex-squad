submission:
  title: "D3 Autonomous Disaster Response Planner"

  problem_statement: >
    During large-scale disasters, emergency coordinators must rapidly allocate
    limited medical teams and rescue units across multiple affected zones with
    no objective scoring tool. Poor prioritisation delays life-saving response.

  solution_summary: >
    A Python backend (Flask + CLI) that scores disaster zones by urgency using
    severity, population, zone type, and road accessibility, then allocates a
    fixed pool of medical teams and rescue units proportionally across zones.

  key_features:
    - "Priority scoring engine: severity × population × type multiplier × accessibility factor"
    - "Proportional floor allocation with remainder top-up guaranteeing exact resource totals"
    - "Flask REST API — GET /api/allocate returns scored and allocated zones as JSON"
    - "CLI entry point — python cli.py prints a formatted allocation table instantly"
    - "Environment-variable-driven configuration for resource pool sizes"

  tech_stack:
    languages: ["Python 3.9+"]
    frameworks: ["Flask"]
    ibm_technologies: ["IBM Bob"]
    databases: []
    other: ["GitHub Actions"]

  what_we_are_most_proud_of: >
    The allocation algorithm guarantees the sum of allocated units always equals
    the available pool exactly (floor allocation + remainder top-up), and the
    clean separation of zones.py / scorer.py / allocator.py makes every layer
    independently testable and replaceable without touching the others.

  known_limitations: >
    Zone data is hardcoded — no live data feed or database integration.
    Scoring multipliers are fixed constants, not user-configurable.
    Flask routes have no authentication (not production-ready).

